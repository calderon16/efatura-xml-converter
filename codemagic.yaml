workflows:
  android-workflow:
    name: Android Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 22.12.0
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor native projects
        script: |
          npx cap sync android
      - name: Build Android APK / AAB
        script: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab

  ios-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 22.12.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor native projects
        script: |
          npx cap sync ios
      - name: Build iOS Xcode workspace
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive
    artifacts:
      - ios/App/build/*.xcarchive
